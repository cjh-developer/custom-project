server:
  port: 9090
  servlet:
    application-display-name: DEII WEB SERVER ADMIN
    session:
      tracking-modes: cookie
      timeout: 7200
    error:
      include-message: always
      include-stacktrace: never
      include-exception: false

spring:
  profiles:
    active: local
    group:
      "local": "local-db"
      "prod": "prod-db"

  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB

  messages:
    basename: messages/message      # messages/message_ko.properties, message_en.properties
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false
    cache-duration: 0

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

logging:
  file:
    path: d:/deii/logs
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 1
      total-size-cap: 1GB
  level:
    org:
      hibernate:
        type:
          descriptor:
            sql: trace
      springframework:
        jdbc:
          core:
            JdbcTemplate: debug
            StatementCreatorUtils : trace
    com.zaxxer.hikari.HikariConfig: debug
---
spring:
  config:
    activate:
      on-profile: local-db
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ism?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    hikari:
      pool-name: hikari-default-
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://localhost:3306/ism?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      username: UXe1VjteSt5JiGdt954aWfwRGhgKHyiZJkf86/HFdw==
      password: XLU75hKnNpzAtuVi0Y7Li9mNfixTu/21obvm6ZPaMCTl
      maximum-pool-size: 5
      connection-timeout: 10000
      validation-timeout: 5000
      auto-commit: true
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
